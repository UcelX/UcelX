<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">UCEL X animated lettering</title>
  <desc id="desc">Minimal monochrome animated developer profile title.</desc>
  <defs>
    <clipPath id="name-reveal">
      <rect x="0" y="0" width="0" height="260">
        <animate attributeName="width" values="0;1200;1200" keyTimes="0;0.45;1" dur="3.8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="tag-reveal">
      <rect x="0" y="0" width="0" height="260">
        <animate attributeName="width" values="0;0;1200;1200" keyTimes="0;0.34;0.72;1" dur="5.8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <filter id="ghost" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="18" fill="#0d0f12"/>

  <g clip-path="url(#name-reveal)">
    <text x="600" y="128" text-anchor="middle" fill="#f4f4f2" font-family="Arial,Helvetica,sans-serif" font-size="92" font-weight="800" letter-spacing="24">UCEL X</text>
  </g>

  <text x="600" y="128" text-anchor="middle" fill="#aeb3ba" opacity="0" font-family="Arial,Helvetica,sans-serif" font-size="92" font-weight="800" letter-spacing="24" filter="url(#ghost)">UCEL X
    <animate attributeName="opacity" values="0;0;.22;0;.14;0" keyTimes="0;.72;.76;.80;.84;1" dur="4.6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="600;600;594;606;600" keyTimes="0;.72;.76;.82;1" dur="4.6s" repeatCount="indefinite"/>
  </text>

  <g clip-path="url(#tag-reveal)">
    <text x="600" y="184" text-anchor="middle" fill="#8d939b" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="19" letter-spacing="5">AI AGENTS  /  WEB3 AUTOMATION  /  SELF-HOSTED TOOLS</text>
  </g>

  <rect x="236" y="201" width="728" height="1" fill="#2b2f35"/>
  <rect x="236" y="201" width="76" height="1" fill="#d7d9dc">
    <animate attributeName="x" values="236;888;236" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="width" values="42;112;42" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <rect x="948" y="91" width="3" height="50" fill="#f4f4f2">
    <animate attributeName="opacity" values="1;0;1" dur=".78s" repeatCount="indefinite"/>
    <animate attributeName="x" values="252;948;948" keyTimes="0;.45;1" dur="3.8s" repeatCount="indefinite"/>
  </rect>
</svg>
